[platformio]
boards_dir = boards

[env:esp32-s3-devkitc-1-n16r8]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1-n16r8
framework = arduino
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_LOOP_STACK_SIZE=32768
    -DFW_VERSION=\"1.01\"
    -DLSB_FIRST
    -DFMSX
    -DBPP8
    -DBPS16
    -DNARROW
    -Ilib/fmsx
    -Ilib/fmsx/fMSX
    -Ilib/fmsx/EMULib
    -Ilib/fmsx/Z80
build_unflags = -Os
